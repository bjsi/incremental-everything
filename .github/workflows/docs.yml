name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache MkDocs dependencies
        uses: actions/cache@v4
        with:
          # Keyed on the pin file, so bumping the version fetches the new wheel
          # instead of serving the old one from cache.
          key: mkdocs-material-${{ hashFiles('docs-requirements.txt') }}
          path: ~/.cache/pip

      - name: Install MkDocs Material
        # Pinned — see docs-requirements.txt for why the theme version and
        # overrides/partials/header.html have to move together.
        run: pip install -r docs-requirements.txt

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
