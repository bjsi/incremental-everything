site_name: Incremental RemNote — User's Manual
site_url: https://hugomarins.github.io/incremental-everything/
site_description: The official User's Manual for the Incremental RemNote plugin.
site_author: bjsi
repo_url: https://github.com/bjsi/incremental-everything
repo_name: bjsi/incremental-everything
edit_uri: ""

theme:
  name: material
  # Holds partials/header.html (a copy of the theme's, plus the contact menu)
  # and partials/contact.html. Kept OUTSIDE docs/ so the templates are not
  # published as pages of the manual.
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: en

# Entries of the header's contact menu (overrides/partials/contact.html).
extra:
  contact:
    - name: Report an issue on GitHub
      link: https://github.com/bjsi/incremental-everything/issues
    - name: Ask on RemNote's Discord
      link: https://discord.com/channels/689979930804617224/1201559830431809566

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # Stop the sidebar at the utility level. Utilities.md nests four deep
      # (page title → group → utility → detail); without this its 59 detail
      # headings all land in the ToC. No other page goes deeper than H3.
      toc_depth: 3

nav:
  - Home: index.md
  - "User's Manual":
    - 1. Getting Started: Getting-Started.md
    - "2. What is Incrementalism?": What-is-Incrementalism?.md
    - 3. The Core Loop:
      - IR Flow — Reading, Extracting & Clozing: IR-Flow--Reading-Extracting-and-Clozing.md
      - Reviewing Items in the Queue: Reviewing-Items-in-the-Queue.md
      - Reviewing Items in the Editor: Reviewing-Items-in-the-Editor.md
    - "4. Prioritization & Sorting": Prioritization-&-Sorting.md
    - "4a. Priorities for Flashcards": Priorities-for-Flashcards.md
    - "4b. Priority Review Document": Priority-Review-Document.md
    - 5. Advanced Workflows:
      - PDF Incremental Reading Workflow: PDF-Incremental-Reading-Workflow.md
      - Create Incremental Rem from PDF Highlights: Create-Incremental-Rem-from-PDF-Highlights.md
      - Incremental Video: Incremental-Video.md
      - IncRem List & Main View: IncRem-List-and-Main-View.md
      - History, Queue Dashboard & Mastery Drill: History-Queue-Dashboard-and-Mastery-Drill.md
      - Study Dashboard: Study-Dashboard.md
    - 6. Essential References:
      - Plugin Widgets Reference: Plugin-Widgets-Reference.md
      - Plugin Commands Reference: Plugin-Commands-Reference.md
      - Plugin Settings Reference: Plugin-Settings-Reference.md
      - IncRem Scheduler: IncRem-Scheduler.md
      - Keyboard Shortcuts: Keyboard-Shortcuts.md
      - Utilities: Utilities.md
      - Full Mode vs Light Mode: Full-Mode-x-Light-Mode.md
    - 7. FAQ & Troubleshooting:
      - Does the plugin prioritize due-today items?: Does-the-plugin-prioritize-items-that-are-due-today-over-older-items?.md
      - How priority and due date interact: How-the-Incremental-Queue-takes-priority-and-due-date-in-consideration.md
      - How to hide card priorities?: How-to-hide-card-priorities?.md
      - Troubleshooting: Troubleshooting.md
    - 8. Changelog: Changelog.md
    - 9. Contributing to the Wiki: Contributing-to-the-Wiki.md
