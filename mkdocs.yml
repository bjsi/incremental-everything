site_name: Incremental RemNote — User's Manual
site_url: https://hugomarins.github.io/incremental-remnote/
site_description: The official User's Manual for the Incremental RemNote plugin.
site_author: bjsi
repo_url: https://github.com/bjsi/incremental-everything
repo_name: bjsi/incremental-everything
edit_uri: ""

theme:
  name: material
  # Holds partials/header.html (a copy of the theme's, plus the contact menu)
  # and partials/contact.html. Kept OUTSIDE docs/ so the templates are not
  # published as pages of the manual.
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: en

# Entries of the header's contact menu (overrides/partials/contact.html).
extra:
  contact:
    - name: Report an issue on GitHub
      link: https://github.com/bjsi/incremental-everything/issues
    - name: Ask on RemNote's Discord
      link: https://discord.com/channels/689979930804617224/1201559830431809566

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # Keep the ToC to H2/H3. The Utilities category pages nest three deep
      # (page title → utility → detail); deeper detail headings stay out of it.
      toc_depth: 3

